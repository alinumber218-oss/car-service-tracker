apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  namespace: car-tracker
type: Opaque
stringData:
  # Placeholder secrets for local/dev clusters only. Generate real random
  # values for staging/production and manage them via Sealed Secrets or the
  # External Secrets Operator - never commit real secrets to Git.
  DATABASE_URL: "postgresql://app_user:app_password@postgres:5432/auth"
  JWT_ACCESS_SECRET: "dev-only-access-secret-change-me"
  JWT_REFRESH_SECRET: "dev-only-refresh-secret-change-me"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: car-tracker
data:
  PORT: "4001"
  NODE_ENV: "production"
  JWT_ACCESS_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "30d"
  CORS_ORIGIN: "*"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: car-tracker
spec:
  selector:
    app: auth-service
  ports:
    - port: 4001
      targetPort: 4001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: car-tracker
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: auth-service:local # replaced by CI with the real registry tag - see .gitlab-ci.yml
          ports:
            - containerPort: 4001
          envFrom:
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: auth-service-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service-hpa
  namespace: car-tracker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
