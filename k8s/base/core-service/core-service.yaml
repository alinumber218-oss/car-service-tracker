apiVersion: v1
kind: Secret
metadata:
  name: core-service-secrets
  namespace: car-tracker
type: Opaque
stringData:
  # Placeholder secrets for local/dev clusters only - see auth-service-secrets note.
  VEHICLE_DATABASE_URL: "postgresql://app_user:app_password@postgres:5432/vehicle"
  SERVICELOG_DATABASE_URL: "postgresql://app_user:app_password@postgres:5432/servicelog"
  # Must match auth-service's JWT_ACCESS_SECRET exactly - Core Service only
  # verifies tokens, it never issues them.
  JWT_ACCESS_SECRET: "dev-only-access-secret-change-me"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: core-service-config
  namespace: car-tracker
data:
  PORT: "4002"
  NODE_ENV: "production"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
  SERVICE_LOG_EVENTS_EXCHANGE: "service-log-events"
  CORS_ORIGIN: "*"
---
apiVersion: v1
kind: Service
metadata:
  name: core-service
  namespace: car-tracker
spec:
  selector:
    app: core-service
  ports:
    - port: 4002
      targetPort: 4002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
  namespace: car-tracker
  labels:
    app: core-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: core-service
  template:
    metadata:
      labels:
        app: core-service
    spec:
      containers:
        - name: core-service
          image: core-service:local # replaced by CI with the real registry tag - see .gitlab-ci.yml
          ports:
            - containerPort: 4002
          envFrom:
            - configMapRef:
                name: core-service-config
            - secretRef:
                name: core-service-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: core-service-hpa
  namespace: car-tracker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: core-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
